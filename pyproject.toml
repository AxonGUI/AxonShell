[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axon-shell"
version = "0.3.1"
description = "The native window layer for Axon apps: frameless window, drag regions, window control, native menu bridge. No UI, no CSS."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "STofone" }]
keywords = ["axon", "axon-gui", "pyside6", "qt", "desktop", "frameless-window", "window-controls", "native-menu"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Desktop Environment :: Window Managers",
  "License :: OSI Approved :: MIT License",
]
dependencies = ["axon-gui>=5.7.2"]

[project.urls]
Repository = "https://github.com/AxonGUI/AxonShell"
Homepage = "https://github.com/AxonGUI/AxonShell"
Issues = "https://github.com/AxonGUI/AxonShell/issues"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["axon_shell"]

[tool.setuptools.package-data]
axon_shell = ["assets/*.js", "assets/*.svg", "assets/*.png", "assets/*.ico"]
