name: windows-exe

on:
  workflow_dispatch:
  push:
    tags: ["demo-*"]

permissions:
  contents: write

env:
  AXON_WHEEL: https://github.com/AxonGUI/Axon/releases/download/v5.3.4/axon_gui-5.3.4-py3-none-any.whl

jobs:
  build:
    name: 打包 Windows 免安装版
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "$env:AXON_WHEEL"
          python -m pip install --no-deps -e .
          python -m pip install pyinstaller

      - name: 取 axon 前端产物
        working-directory: examples/files
        run: |
          npm install axon-gui@1.0.0 --no-save
          if (-not (Test-Path node_modules/axon-gui/dist/axon.umd.cjs)) { throw "缺少 axon.umd.cjs" }

      - name: PyInstaller
        run: python tools/build_exe.py --clean

      - name: 打出来的程序能启动
        run: |
          $exe = "dist/AxonFiles/AxonFiles.exe"
          if (-not (Test-Path $exe)) { throw "没有生成 $exe" }
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke" -PassThru -Wait
          "exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "自检失败 exit=$($p.ExitCode)" }

      - name: 压缩
        run: |
          Compress-Archive -Path dist/AxonFiles/* -DestinationPath AxonFiles-windows-x64.zip -Force
          Get-Item AxonFiles-windows-x64.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: AxonFiles-windows-x64
          path: AxonFiles-windows-x64.zip

      - name: 挂到 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/demo-')
        uses: softprops/action-gh-release@v2
        with:
          files: AxonFiles-windows-x64.zip
          body: |
            用 axon-shell 做的示例程序（文件浏览器）。

            解压后双击 `AxonFiles/AxonFiles.exe`。
