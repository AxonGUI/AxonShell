name: windows-exe

on:
  workflow_dispatch:
  push:
    tags: ["demo-*"]

permissions:
  contents: write

jobs:
  build:
    name: 打包 Windows 免安装版
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "axon-gui>=5.7.2"
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: 取 axon 前端产物
        working-directory: examples/basic
        run: |
          npm install axon-gui@^1.4.2 --no-save
          if (-not (Test-Path node_modules/axon-gui/dist/axon.umd.cjs)) { throw "缺少 axon.umd.cjs" }

      - name: PyInstaller
        run: python tools/build_exe.py --clean

      - name: 打出来的程序能启动
        run: |
          $exe = "dist/AxonShellDemo/AxonShellDemo.exe"
          if (-not (Test-Path $exe)) { throw "没有生成 $exe" }
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke" -PassThru -Wait
          "exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "自检失败 exit=$($p.ExitCode)" }

      - name: 压缩
        run: |
          Compress-Archive -Path dist/AxonShellDemo -DestinationPath AxonShellDemo-windows-x64.zip -Force
          Get-Item AxonShellDemo-windows-x64.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: AxonShellDemo-windows-x64
          path: AxonShellDemo-windows-x64.zip

      - name: 挂到 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/demo-')
        uses: softprops/action-gh-release@v2
        with:
          files: AxonShellDemo-windows-x64.zip
          body: |
            `axon-shell` 的最小示例（一条可拖动的顶栏 + 三个窗口按钮 + 三个演示按钮）。

            解压后双击 `AxonShellDemo/AxonShellDemo.exe`。无需安装 Python 或 Node。
