name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 语法检查
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: python compileall
        run: python -m compileall -q src examples tests
      - name: node --check
        run: |
          node --check src/axon_shell/assets/shell.js
          node --check examples/basic/web/app.js

  smoke:
    name: 无头自检
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: 装 Qt 运行库（QtWebEngine 需要）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbfile1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libnss3 libglib2.0-0 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libasound2 libxshmfence1
      - name: 装 axon-gui 与依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "axon-gui>=5.7.2"
          python -m pip install -e .
      - name: 取 axon 前端产物
        working-directory: examples/basic
        run: |
          npm install axon-gui@^1.4.2 --no-save
          test -f node_modules/axon-gui/dist/axon.umd.cjs
      - name: 窗口自检
        working-directory: examples/basic
        run: python main.py --smoke
      - name: 端到端自检
        run: python tests/verify.py
      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-report
          path: tests/verify_report.json
          if-no-files-found: ignore
