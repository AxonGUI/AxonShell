name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 语法检查
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: python compileall
        run: python -m compileall -q src examples tests
      - name: node --check
        run: |
          node --check src/axon_shell/assets/shell.js
          node --check examples/basic/web/app.js

  smoke:
    name: 无头自检 ${{ matrix.python-version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      # axon-gui 声明支持 3.12–3.15（元数据上界 <3.16，跟着 PySide6 的轮子走）；
      # 这里四个小版本全跑，声明了的版本就得有 CI 守着。
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: 装 Qt 运行库（QtWebEngine 需要）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbfile1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libnss3 libglib2.0-0 libxcomposite1 libxdamage1 libxrandr2 \
            libxtst6 libasound2 libxshmfence1
      - name: 装 axon-gui 与依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "axon-gui>=5.8.2"
          python -m pip install -e .
      - name: 取 axon 前端产物
        working-directory: examples/basic
        run: |
          npm install axon-gui@^1.4.2 --no-save
          test -f node_modules/axon-gui/dist/axon.umd.cjs
      - name: 窗口自检
        working-directory: examples/basic
        run: python main.py --smoke
      - name: 端到端自检
        run: python tests/verify.py
      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-report-${{ matrix.python-version }}
          path: tests/verify_report.json
          if-no-files-found: ignore

  # macOS：窗口层是「原生那一层」，在别的平台上跑通不代表 macOS 上也能开窗。
  # 这里用 cocoa（不是 offscreen）跑同一份自检，并检查窗口真的可见。
  macos:
    name: macOS 自检 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # macos-13（Intel）已被 GitHub 退役；现役 x86_64 标准镜像是 macos-15-intel。
      matrix:
        os: ["macos-15-intel", "macos-latest"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: 装 axon-gui 与依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "axon-gui>=5.8.2"
          python -m pip install -e .
      - name: 取 axon 前端产物
        working-directory: examples/basic
        run: |
          npm install axon-gui@^1.5.0 --no-save
          test -f node_modules/axon-gui/dist/axon.umd.cjs
      - name: 窗口自检（真窗口，cocoa）
        working-directory: examples/basic
        env:
          QT_QPA_PLATFORM: cocoa
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: python main.py --smoke
      - name: 端到端自检（无头）
        run: python tests/verify.py
